[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mllm52"
version = "5.2"
description = "MLLM-5.2 — lightweight autocomplete micro LM (causal n-gram)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "morriszdweck" }]
keywords = ["autocomplete", "language-model", "n-gram", "toy-model"]

[project.scripts]
mllm52 = "mllm52.cli:main"

[tool.setuptools]
packages = ["mllm52"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
